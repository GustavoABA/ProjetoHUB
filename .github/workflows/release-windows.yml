name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: npm
      - run: npm ci
      - run: npm run build
      - shell: pwsh
        run: ./scripts/package-windows.ps1
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "release/ProjetoHUB-${{ github.ref_name }}-win-x64.zip" --title "ProjetoHUB ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md --prerelease --verify-tag
